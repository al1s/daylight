<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7661d8">
  <meta name="description" content="A gentle place to notice how you feel. Track symptoms, meals, and daily patterns in a notebook saved on your device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daylight">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Daylight · Your symptom notebook</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <script src="./diary-core.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15M6 8h3m-3 4h3m6-4h3m-3 4h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M7 14l4-5 4 3 5-7"/><circle cx="11" cy="9" r="1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h4m4 0h8M4 17h9m4 0h3"/><circle cx="10" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H4v11h16V10h-3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm9-9 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C9 2 3 7 5 14s13 6 15-11ZM4 21 15 10"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main">Skip to notebook</a>
  <header class="topbar">
    <button class="brand" data-nav="today" aria-label="Daylight home"><span class="brand-icon"><svg><use href="#i-sun"/></svg></span><span>daylight<span class="brand-sub">YOUR SYMPTOM NOTEBOOK</span></span></button>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button data-nav="today">Today</button><button data-nav="history">Notebook</button><button data-nav="patterns">Patterns</button><button data-nav="settings">Settings</button>
    </nav>
    <button class="privacy-pill" data-action="privacy" aria-label="About local storage"><svg class="icon"><use href="#i-lock"/></svg><span>On this device</span></button>
  </header>
  <div id="storage-banner" class="storage-banner" role="alert" hidden></div>
  <main id="main" tabindex="-1"></main>
  <nav class="mobile-nav" aria-label="Main navigation">
    <button data-nav="today"><svg class="icon"><use href="#i-sun"/></svg><span>Today</span></button>
    <button data-nav="history"><svg class="icon"><use href="#i-book"/></svg><span>Notebook</span></button>
    <button data-nav="patterns"><svg class="icon"><use href="#i-chart"/></svg><span>Patterns</span></button>
    <button data-nav="settings"><svg class="icon"><use href="#i-sliders"/></svg><span>Settings</span></button>
  </nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript><p class="card">Daylight needs JavaScript to save and display your notebook. Enable JavaScript in Safari to continue.</p></noscript>
</body>
</html>
